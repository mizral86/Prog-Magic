<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1116" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Collezione, mazzi, simulazioni e partite con gli amici per Magic: The Gathering. Contenuto non ufficiale." />
    <!-- Anteprima quando si condivide il link. Se l'app cambia indirizzo, aggiorna og:url e og:image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Menga Deck" />
    <meta property="og:title" content="Menga Deck — Più di un deck, una storia" />
    <meta property="og:description" content="Collezione, mazzi, simulazioni e partite con gli amici per Magic: The Gathering." />
    <meta property="og:url" content="https://mizral86.github.io/Prog-Magic/" />
    <meta property="og:image" content="https://mizral86.github.io/Prog-Magic/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="it_IT" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Kaushan+Script&display=swap"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Animazione di apertura: una sola volta per apertura dell'app.
      // Se ricarichi la pagina (stessa sessione) non riparte.
      (function () {
        var d = document.documentElement;
        try {
          if (sessionStorage.getItem("mm.splash")) d.classList.add("no-splash");
          else sessionStorage.setItem("mm.splash", "1");
        } catch (e) { /* storage non disponibile: la mostra */ }
        // Tema della schermata: scelta salvata oppure tema del sistema.
        var t = null;
        try { t = localStorage.getItem("pm.theme"); } catch (e) {}
        var dark = t === "dark" || (t !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        d.setAttribute("data-splash", dark ? "dark" : "light");
      })();
    </script>
    <style>
      /* Schermata di apertura "Cinque luci". Inline per comparire subito. */
      #splash {
        --s-bg: radial-gradient(circle at 50% 42%, #fffaf0 0%, #f4ecdc 55%, #e9dcc0 100%);
        --s-ink: #1d1a24; --s-gold: #b8862a; --s-tag: #6b5a3a; --s-glow: rgba(184, 134, 42, 0.35);
        --W: #e7c860; --U: #2f7fd0; --B: #7b54a8; --R: #d4452b; --G: #2f9152;
        position: fixed; inset: 0; z-index: 9999; overflow: hidden;
        background: var(--s-bg);
        transition: opacity 0.45s ease, visibility 0.45s;
      }
      [data-splash="dark"] #splash {
        --s-bg: radial-gradient(circle at 50% 42%, #1a2442 0%, #090e1c 62%);
        --s-ink: #f3e6c4; --s-gold: #e8b64e; --s-tag: #d9b77a; --s-glow: rgba(232, 182, 78, 0.55);
      }
      .no-splash #splash { display: none; }
      #splash.hide { opacity: 0; visibility: hidden; }
      #splash .sp-orb {
        position: absolute; left: 50%; top: 42%; width: 9vmin; height: 9vmin; margin: -4.5vmin;
        border-radius: 50%; opacity: 0;
        background: radial-gradient(circle at 35% 35%, #fff 0 12%, var(--c) 45%, transparent 72%);
        box-shadow: 0 0 6vmin 1vmin var(--c);
        animation: sp-spiral 1.15s 0.1s cubic-bezier(0.55, 0, 0.35, 1) forwards;
      }
      #splash .sp-flash {
        position: absolute; left: 50%; top: 42%; width: 60vmin; height: 60vmin; margin: -30vmin;
        border-radius: 50%; opacity: 0; transform: scale(0.2);
        background: radial-gradient(circle, #fff 0%, var(--s-gold) 28%, transparent 68%);
        animation: sp-flash 0.9s 1.15s ease-out forwards;
      }
      #splash .sp-logo {
        position: absolute; left: 50%; top: 42%; width: min(78vmin, 360px); height: auto; aspect-ratio: 1;
        transform: translate(-50%, -50%) scale(0.3); opacity: 0; filter: brightness(1.8) blur(4px);
        animation: sp-logo 0.8s 1.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      @keyframes sp-spiral {
        0% { opacity: 0; transform: rotate(var(--a)) translateY(-48vmin) scale(1.2); }
        15% { opacity: 1; }
        90% { opacity: 1; transform: rotate(calc(var(--a) + 260deg)) translateY(0) scale(0.5); }
        100% { opacity: 0; transform: rotate(calc(var(--a) + 280deg)) translateY(0) scale(0.2); }
      }
      @keyframes sp-flash {
        0% { opacity: 0; transform: scale(0.2); }
        25% { opacity: 1; }
        100% { opacity: 0.22; transform: scale(1.5); }
      }
      @keyframes sp-logo {
        to { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: brightness(1) blur(0) drop-shadow(0 0 3vmin var(--s-glow)); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash { animation-duration: 0.01s !important; animation-delay: 0s !important; }
      }
    </style>
    <title>Menga Deck — Collezione e mazzi</title>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <span class="sp-orb" style="--c: var(--W); --a: 0deg"></span>
      <span class="sp-orb" style="--c: var(--U); --a: 72deg"></span>
      <span class="sp-orb" style="--c: var(--B); --a: 144deg"></span>
      <span class="sp-orb" style="--c: var(--R); --a: 216deg"></span>
      <span class="sp-orb" style="--c: var(--G); --a: 288deg"></span>
      <span class="sp-flash"></span>
      <img class="sp-logo" src="/logo-splash.webp" alt="Menga Deck" />
    </div>
    <script>
      // Un tocco la salta; si chiude quando l'app è pronta (minimo 2,8 s).
      (function () {
        var el = document.getElementById("splash");
        var skip = document.documentElement.classList.contains("no-splash");
        var start = Date.now();
        var MIN = 2800;
        var done = false;
        function hide() {
          if (done) return;
          done = true;
          el.classList.add("hide");
          setTimeout(function () { el.remove(); }, 600);
        }
        if (skip) { el.remove(); window.__hideSplash = function () {}; return; }
        el.addEventListener("click", hide);
        window.__hideSplash = function () {
          setTimeout(hide, Math.max(0, MIN - (Date.now() - start)));
        };
        setTimeout(hide, 6000); // sicurezza se l'app non parte
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
